<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三十六计 · 技能五子棋</title>
    <link rel="stylesheet" href="css/gomoku.css">
</head>
<body>
    <div class="game-container">
        <div class="info-panel">
            <h1>🔥 三十六计 · 五子棋</h1>
            <div class="player-info active" id="black-player">
                <div class="player-stone black"></div>
                <div class="player-details">
                    <span class="player-name">黑方</span>
                    <div class="energy-bar">
                        <div class="energy-fill" id="black-energy-fill" style="width: 0%"></div>
                        <span class="energy-text" id="black-energy-text">0 / 10</span>
                    </div>
                </div>
            </div>
            <div class="player-info" id="white-player">
                <div class="player-stone white"></div>
                <div class="player-details">
                    <span class="player-name">白方</span>
                    <div class="energy-bar">
                        <div class="energy-fill" id="white-energy-fill" style="width: 0%"></div>
                        <span class="energy-text" id="white-energy-text">0 / 10</span>
                    </div>
                </div>
            </div>
            <div class="game-status" id="game-status"></div>
            <div class="controls">
                <button class="btn btn-secondary" id="ai-mode-btn">🤖 AI对战: 关闭</button>
                <button class="btn btn-secondary" id="undo-btn">↩️ 悔棋</button>
                <button class="btn btn-secondary" id="cancel-btn">✖ 取消技能</button>
                <button class="btn btn-primary" id="restart-btn">🔄 新局</button>
                <button class="btn btn-secondary" id="rematch-btn">🎯 重玩</button>
                <button class="btn btn-secondary" id="test-mode-btn">🧪 开启测试模式</button>
            </div>
        </div>

        <div class="board-area">
            <div class="board-container">
                <div id="board"></div>
                <div class="effect-layer" id="effect-layer"></div>
            </div>
        </div>

        <div class="skills-panel">
            <h2>✨ 本局技能池</h2>
            <div class="skill-pool-info" id="skill-pool-info"></div>
            <div id="skills-list"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">🎉 游戏结束</h2>
            <p id="modal-message"></p>
            <div class="modal-skills" id="modal-skills"></div>
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" id="modal-rematch-btn">🎯 重玩本组</button>
                <button class="btn btn-secondary" id="modal-restart-btn">🔄 新局</button>
            </div>
        </div>
    </div>

    <!-- 加载顺序即依赖顺序：普通脚本共享全局作用域，双击本文件即可运行 -->
    <script src="js/board.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/view.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
